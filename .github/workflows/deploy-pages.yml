name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_STAFF_EMAIL: ${{ vars.VITE_STAFF_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate repository variables
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing repository variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Missing repository variable: VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          test -n "$VITE_STAFF_EMAIL" || { echo "::error::Missing repository variable: VITE_STAFF_EMAIL"; exit 1; }
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix staff/order-console
          npm ci --prefix staff/development-dashboard
      - name: Build game
        run: npm run build
        env:
          VITE_PAGES_BASE: ./
      - name: Build employee order console
        run: npm run build --prefix staff/order-console
        env:
          VITE_PAGES_BASE: ./
      - name: Build development dashboard
        run: npm run build --prefix staff/development-dashboard
        env:
          VITE_PAGES_BASE: ./
      - name: Verify production configuration and page assets
        run: |
          if grep -n -E '^(<<<<<<<|=======|>>>>>>>)' dist/index.html staff/order-console/dist/index.html staff/development-dashboard/dist/index.html; then
            echo "::error::A built page contains unresolved merge-conflict markers"
            exit 1
          fi
          grep -R -Fq -- "$VITE_SUPABASE_URL" dist
          grep -R -Fq -- "$VITE_SUPABASE_PUBLISHABLE_KEY" dist
          grep -R -Fq -- "$VITE_SUPABASE_URL" staff/order-console/dist
          grep -R -Fq -- "$VITE_SUPABASE_PUBLISHABLE_KEY" staff/order-console/dist
          grep -R -Fq -- "$VITE_STAFF_EMAIL" staff/order-console/dist
          grep -R -Fq -- "$VITE_SUPABASE_URL" staff/development-dashboard/dist
          grep -R -Fq -- "$VITE_SUPABASE_PUBLISHABLE_KEY" staff/development-dashboard/dist
          grep -R -Fq -- "$VITE_STAFF_EMAIL" staff/development-dashboard/dist
          test -f dist/index.html
          test -f staff/order-console/dist/index.html
          test -f staff/development-dashboard/dist/index.html
          grep -q 'src="./assets/' staff/order-console/dist/index.html
          grep -q 'href="./assets/' staff/order-console/dist/index.html
          grep -q 'src="./assets/' staff/development-dashboard/dist/index.html
          grep -q 'href="./assets/' staff/development-dashboard/dist/index.html
      - name: Assemble Pages site
        run: |
          mkdir -p _site/order _site/dev
          cp -R dist/. _site/
          cp -R staff/order-console/dist/. _site/order/
          cp -R staff/development-dashboard/dist/. _site/dev/
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
